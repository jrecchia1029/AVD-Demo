#### Override for vEOS/cEOS Lab Caveats ####
p2p_uplinks_mtu: 1500

# Underlay Routing Protocol
underlay_routing_protocol: ebgp
overlay_routing_protocol: ebgp

generate_cv_tags:
  device_tags:
    - name: Campus
      data_path: campus_tag
  device_tags:
    - name: Campus-Pod
      data_path: campus_pod_tag
  device_tags:
    - name: Access-Pod
      data_path: access_pod_tag