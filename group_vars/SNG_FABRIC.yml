---
### group_vars/DC1_FABRIC.yml

fabric_name: SNG_FABRIC

# Set Design Type to L2ls
design:
  type: l2ls

mgmt_interface_vrf: "default"
mgmt_vrf_routing: true

cvp_instance_ips:
  - 192.168.0.5

# Ansible connectivity definitions
# eAPI connectivity via HTTPS is specified (as opposed to network_cli via SSH)
ansible_connection: ansible.netcommon.httpapi
# Specifies that we are indeed using Arista EOS
ansible_network_os: arista.eos.eos
# This user/password must exist on the switches to enable Ansible access
ansible_user: admin
ansible_password: admin
# User escalation (to enter enable mode)
ansible_become: true
ansible_become_method: enable
# Use SSL (HTTPS)
ansible_httpapi_use_ssl: true
# Do not try to validate certs
ansible_httpapi_validate_certs: false

custom_structured_configuration_campus_tag: SNG
custom_structured_configuration_campus_pod_tag: Pod1

# Spine Switches
l3spine:
  defaults:
    platform: vEOS-Lab
    spanning_tree_mode: mstp
    spanning_tree_priority: 4096
    loopback_ipv4_pool: 172.16.255.0/24
    bgp_as: 65000
    mlag_interfaces: [Ethernet49, Ethernet50]
    mlag_peer_ipv4_pool: 192.168.254.0/25
    mlag_peer_l3_ipv4_pool: 192.168.254.128/25
    mlag_domain_id: MLAG
    virtual_router_mac_address: 00:1c:73:00:00:99 
  node_groups:
    - group: SPINES
      filter:
        tags: ["all"]
      nodes:
        - name: SPINE1
          serial_number: SN-SPINE1
          id: 1
          mgmt_ip: 192.168.0.11/24
        - name: SPINE2
          serial_number: SN-SPINE2
          id: 2
          mgmt_ip: 192.168.0.12/24

# IDF - Leaf Switches
leaf:
  defaults:
    platform: vEOS-Lab
    mlag_peer_ipv4_pool: 192.168.254.0/25
    mlag_peer_l3_ipv4_pool: 192.168.254.128/25
    mlag_domain_id: MLAG
    virtual_router_mac_address: 00:1c:73:00:00:99 
    spanning_tree_mode: mstp
    spanning_tree_priority: 4096
    mlag_interfaces: [Ethernet49, Ethernet50]
    loopback_ipv4_pool: 172.16.0.0/24
    loopback_ipv4_offset: 2
    vtep_loopback_ipv4_pool: 172.16.1.0/24
    uplink_ipv4_pool: 172.16.200.0/24
    uplink_interfaces: [Ethernet51, Ethernet52]
    uplink_switches: [SPINE1, SPINE2]
  node_groups:
    - group: Floor1_Leafs
      bgp_as: 65001
      filter:
        tags: ["all"]
      nodes:
        - name: LEAF1A
          serial_number: SN-LEAF1A
          id: 1
          mgmt_ip: 192.168.0.13/24
          uplink_switch_interfaces: [Ethernet1, Ethernet1]
        - name: LEAF1B
          serial_number: SN-LEAF1B
          id: 2
          mgmt_ip: 192.168.0.14/24
          uplink_switch_interfaces: [Ethernet2, Ethernet2]
    - group: Floor2_Leafs
      bgp_as: 65002
      filter:
        tags: ["all"]
      # custom_structured_configuration_access_pod_tag: Floor2
      nodes:
        - name: LEAF2A
          serial_number: SN-LEAF2A
          id: 3
          mgmt_ip: 192.168.0.17/24
          uplink_switch_interfaces: [Ethernet3, Ethernet3]
        - name: LEAF2B
          serial_number: SN-LEAF2B
          id: 4
          mgmt_ip: 192.168.0.18/24
          uplink_switch_interfaces: [Ethernet4, Ethernet4]
