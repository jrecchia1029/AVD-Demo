!
no enable password
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$eucN5ngreuExDgwS$xnD7T8jO..GBDX0DUlp.hn.W7yW94xTjSanqgaQGBzPIhDAsyAl9N4oScHvOMvf07uVBFI4mKMxwdVEUVKgY/.
username cvpadmin privilege 15 role network-admin secret sha512 $6$XOCcW4/weIt.C2WR$AtbIXCExWUYtwFYNONsRXROqasVjijl3j9HZVXgMIV/favxx3D2uxRH45L2kwD0G1x/K8sn6fIjKiiDgzd0Gr1
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=192.168.0.5:9910 -cvauth=token,/tmp/token -cvvrf=default -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -ingestexclude=/Sysdb/cell/1/agent,/Sysdb/cell/2/agent -taillogs
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname NoLa-Leaf-2B
!
spanning-tree mode mstp
no spanning-tree vlan-id 4093-4094
spanning-tree mst 0 priority 4096
!
vlan 11
   name VRF10_VLAN11
!
vlan 12
   name VRF10_VLAN12
!
vlan 21
   name VRF11_VLAN21
!
vlan 22
   name VRF11_VLAN22
!
vlan 3009
   name MLAG_L3_VRF_VRF10
   trunk group MLAG
!
vlan 3010
   name MLAG_L3_VRF_VRF11
   trunk group MLAG
!
vlan 3401
   name L2_VLAN3401
!
vlan 3402
   name L2_VLAN3402
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance VRF10
!
vrf instance VRF11
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf default
      no shutdown
!
aaa authorization exec default local
!
interface Port-Channel49
   description MLAG_NoLa-Leaf-2A_Port-Channel49
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Port-Channel53
   description L2_NoLa-Leaf-2C_Port-Channel51
   no shutdown
   switchport trunk allowed vlan 11-12,21-22,3401-3402
   switchport mode trunk
   switchport
   mlag 53
!
interface Port-Channel54
   description L2_NoLa-Leaf-2D_Port-Channel51
   no shutdown
   switchport trunk allowed vlan 11-12,21-22,3401-3402
   switchport mode trunk
   switchport
   mlag 54
!
interface Ethernet49
   description MLAG_NoLa-Leaf-2A_Ethernet49
   no shutdown
   channel-group 49 mode active
!
interface Ethernet50
   description MLAG_NoLa-Leaf-2A_Ethernet50
   no shutdown
   channel-group 49 mode active
!
interface Ethernet51
   description P2P_NoLa-Spine-1_Ethernet4
   no shutdown
   mtu 1500
   no switchport
   ip address 172.16.200.13/31
!
interface Ethernet52
   description P2P_NoLa-Spine-2_Ethernet4
   no shutdown
   mtu 1500
   no switchport
   ip address 172.16.200.15/31
!
interface Ethernet53
   description L2_NoLa-Leaf-2C_Ethernet52
   no shutdown
   channel-group 53 mode active
!
interface Ethernet54
   description L2_NoLa-Leaf-2D_Ethernet52
   no shutdown
   channel-group 54 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 172.16.0.6/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 172.16.1.5/32
!
interface Loopback10
   description DIAG_VRF_VRF10
   no shutdown
   vrf VRF10
   ip address 10.255.10.6/32
!
interface Loopback11
   description DIAG_VRF_VRF11
   no shutdown
   vrf VRF11
   ip address 10.255.11.6/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   ip address 192.168.0.18/24
!
interface Vlan11
   description VRF10_VLAN11
   no shutdown
   vrf VRF10
   ip address virtual 10.10.11.1/24
!
interface Vlan12
   description VRF10_VLAN12
   no shutdown
   vrf VRF10
   ip address virtual 10.10.12.1/24
!
interface Vlan21
   description VRF11_VLAN21
   no shutdown
   vrf VRF11
   ip address virtual 10.10.21.1/24
!
interface Vlan22
   description VRF11_VLAN22
   no shutdown
   vrf VRF11
   ip address virtual 10.10.22.1/24
!
interface Vlan3009
   description MLAG_L3_VRF_VRF10
   no shutdown
   mtu 1500
   vrf VRF10
   ip address 192.168.254.133/31
!
interface Vlan3010
   description MLAG_L3_VRF_VRF11
   no shutdown
   mtu 1500
   vrf VRF11
   ip address 192.168.254.133/31
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 1500
   ip address 192.168.254.133/31
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 1500
   no autostate
   ip address 192.168.254.5/31
!
interface Vxlan1
   description NoLa-Leaf-2B_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
   vxlan vlan 11 vni 10011
   vxlan vlan 12 vni 10012
   vxlan vlan 21 vni 10021
   vxlan vlan 22 vni 10022
   vxlan vlan 3401 vni 13401
   vxlan vlan 3402 vni 13402
   vxlan vrf VRF10 vni 10
   vxlan vrf VRF11 vni 11
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip address virtual source-nat vrf VRF10 address 10.255.10.6
ip address virtual source-nat vrf VRF11 address 10.255.11.6
!
ip routing
ip routing vrf VRF10
ip routing vrf VRF11
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 172.16.0.0/24 eq 32
   seq 20 permit 172.16.1.0/24 eq 32
!
ip prefix-list PL-MLAG-PEER-VRFS
   seq 10 permit 192.168.254.132/31
!
mlag configuration
   domain-id MLAG
   local-interface Vlan4094
   peer-address 192.168.254.4
   peer-link Port-Channel49
   reload-delay mlag 300
   reload-delay non-mlag 330
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-CONN-2-BGP-VRFS deny 10
   match ip address prefix-list PL-MLAG-PEER-VRFS
!
route-map RM-CONN-2-BGP-VRFS permit 20
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65002
   router-id 172.16.0.6
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 12000
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65002
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description NoLa-Leaf-2A
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 12000
   neighbor 172.16.200.12 peer group IPv4-UNDERLAY-PEERS
   neighbor 172.16.200.12 remote-as 65000
   neighbor 172.16.200.12 description NoLa-Spine-1_Ethernet4
   neighbor 172.16.200.14 peer group IPv4-UNDERLAY-PEERS
   neighbor 172.16.200.14 remote-as 65000
   neighbor 172.16.200.14 description NoLa-Spine-2_Ethernet4
   neighbor 172.16.255.1 peer group EVPN-OVERLAY-PEERS
   neighbor 172.16.255.1 remote-as 65000
   neighbor 172.16.255.1 description NoLa-Spine-1_Loopback0
   neighbor 172.16.255.2 peer group EVPN-OVERLAY-PEERS
   neighbor 172.16.255.2 remote-as 65000
   neighbor 172.16.255.2 description NoLa-Spine-2_Loopback0
   neighbor 192.168.254.132 peer group MLAG-IPv4-UNDERLAY-PEER
   neighbor 192.168.254.132 description NoLa-Leaf-2A_Vlan4093
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 11
      rd 172.16.0.6:10011
      route-target both 10011:10011
      redistribute learned
   !
   vlan 12
      rd 172.16.0.6:10012
      route-target both 10012:10012
      redistribute learned
   !
   vlan 21
      rd 172.16.0.6:10021
      route-target both 10021:10021
      redistribute learned
   !
   vlan 22
      rd 172.16.0.6:10022
      route-target both 10022:10022
      redistribute learned
   !
   vlan 3401
      rd 172.16.0.6:13401
      route-target both 13401:13401
      redistribute learned
   !
   vlan 3402
      rd 172.16.0.6:13402
      route-target both 13402:13402
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
   !
   vrf VRF10
      rd 172.16.0.6:10
      route-target import evpn 10:10
      route-target export evpn 10:10
      router-id 172.16.0.6
      update wait-install
      neighbor 192.168.254.132 peer group MLAG-IPv4-UNDERLAY-PEER
      neighbor 192.168.254.132 description NoLa-Leaf-2A_Vlan3009
      redistribute connected route-map RM-CONN-2-BGP-VRFS
   !
   vrf VRF11
      rd 172.16.0.6:11
      route-target import evpn 11:11
      route-target export evpn 11:11
      router-id 172.16.0.6
      update wait-install
      neighbor 192.168.254.132 peer group MLAG-IPv4-UNDERLAY-PEER
      neighbor 192.168.254.132 description NoLa-Leaf-2A_Vlan3010
      redistribute connected route-map RM-CONN-2-BGP-VRFS
!
end
