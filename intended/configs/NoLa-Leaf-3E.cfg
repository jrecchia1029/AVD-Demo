!
no enable password
no aaa root
!
username cvpadmin privilege 15 role network-admin secret sha512 $6$ikGzKyb6w4yEqLly$mJLofKfPrT2Mx6UffrY2dwFXuTCbtf2Okjfu9CgyuduVdN3WIrq9quRZXXFjrRI754ewFQ3uZSlwSEKAe2zbP1
!
agent KernelFib environment KERNELFIB_PROGRAM_ALL_ECMP='true'
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=apiserver.arista.io:443 -cvauth=token-secure,/tmp/cv-onboarding-token -cvvrf=default -disableaaa -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -ingestexclude=/Sysdb/cell/1/agent,/Sysdb/cell/2/agent -taillogs
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname NoLa-Leaf-3E
ip name-server vrf default 1.1.1.1
ip name-server vrf default 8.8.8.8
ip name-server vrf default 169.254.169.254
!
spanning-tree mode mstp
spanning-tree mst 0 priority 4096
!
vlan 11
   name VRF10_VLAN11
!
vlan 12
   name VRF10_VLAN12
!
vlan 21
   name VRF11_VLAN21
!
vlan 22
   name VRF11_VLAN22
!
vlan 3401
   name L2_VLAN3401
!
vlan 3402
   name L2_VLAN3402
!
vlan 4092
   name INBAND_MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf default
      no shutdown
!
aaa authorization exec default local
!
interface Port-Channel25
   description L2_Floor3_Leafs_Port-Channel55
   no shutdown
   switchport trunk allowed vlan 11-12,21-22,3401-3402,4092
   switchport mode trunk
   switchport
!
interface Ethernet25
   description L2_NoLa-Leaf-3A_Ethernet55
   no shutdown
   channel-group 25 mode active
!
interface Ethernet26
   description L2_NoLa-Leaf-3B_Ethernet55
   no shutdown
   channel-group 25 mode active
!
interface Management1
   no lldp transmit
   no lldp receive
!
interface Vlan4092
   description Inband Management
   no shutdown
   mtu 1500
   ip address 10.40.92.12/24
!
ip route 0.0.0.0/0 10.40.92.1
!
ntp server pool.ntp.org
!
end
