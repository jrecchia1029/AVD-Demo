!
no enable password
no aaa root
!
username cvpadmin privilege 15 role network-admin secret sha512 $6$ikGzKyb6w4yEqLly$mJLofKfPrT2Mx6UffrY2dwFXuTCbtf2Okjfu9CgyuduVdN3WIrq9quRZXXFjrRI754ewFQ3uZSlwSEKAe2zbP1
!
agent KernelFib environment KERNELFIB_PROGRAM_ALL_ECMP='true'
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=apiserver.arista.io:443 -cvauth=token-secure,/tmp/cv-onboarding-token -cvvrf=default -disableaaa -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -ingestexclude=/Sysdb/cell/1/agent,/Sysdb/cell/2/agent -taillogs
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname NoLa-Leaf-3A
ip name-server vrf default 1.1.1.1
ip name-server vrf default 8.8.8.8
ip name-server vrf default 169.254.169.254
!
spanning-tree mode mstp
no spanning-tree vlan-id 4094
spanning-tree mst 0 priority 4096
!
vlan 4092
   name INBAND_MGMT
!
vlan 4094
   name MLAG
   trunk group MLAG
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf default
      no shutdown
!
aaa authorization exec default local
!
interface Port-Channel49
   description MLAG_NoLa-Leaf-3B_Port-Channel49
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
   port-channel lacp fallback individual
   port-channel lacp fallback timeout 30
!
interface Port-Channel51
   description L2_SPINES_Port-Channel4
   no shutdown
   switchport trunk allowed vlan 4092
   switchport mode trunk
   switchport
   mlag 51
!
interface Port-Channel53
   description L2_NoLa-Leaf-3C_Port-Channel25
   no shutdown
   switchport trunk allowed vlan 11-12,21-22,3401-3402,4092
   switchport mode trunk
   switchport
   port-channel lacp fallback individual
   port-channel lacp fallback timeout 30
   mlag 53
!
interface Port-Channel54
   description L2_NoLa-Leaf-3D_Port-Channel25
   no shutdown
   switchport trunk allowed vlan 11-12,21-22,3401-3402,4092
   switchport mode trunk
   switchport
   port-channel lacp fallback individual
   port-channel lacp fallback timeout 30
   mlag 54
!
interface Port-Channel55
   description L2_NoLa-Leaf-3E_Port-Channel25
   no shutdown
   switchport trunk allowed vlan 11-12,21-22,3401-3402,4092
   switchport mode trunk
   switchport
   port-channel lacp fallback individual
   port-channel lacp fallback timeout 30
   mlag 55
!
interface Ethernet49
   description MLAG_NoLa-Leaf-3B_Ethernet49
   no shutdown
   switchport access vlan 4092
   switchport mode access
   switchport
   channel-group 49 mode active
!
interface Ethernet50
   description MLAG_NoLa-Leaf-3B_Ethernet50
   no shutdown
   switchport access vlan 4092
   switchport mode access
   switchport
   channel-group 49 mode active
!
interface Ethernet51
   description L2_NoLa-Spine-1_Ethernet4
   no shutdown
   channel-group 51 mode active
!
interface Ethernet52
   description L2_NoLa-Spine-2_Ethernet4
   no shutdown
   channel-group 51 mode active
!
interface Ethernet53
   description L2_NoLa-Leaf-3C_Ethernet25
   no shutdown
   switchport access vlan 4092
   switchport mode access
   switchport
   channel-group 53 mode active
!
interface Ethernet54
   description L2_NoLa-Leaf-3D_Ethernet25
   no shutdown
   switchport access vlan 4092
   switchport mode access
   switchport
   channel-group 54 mode active
!
interface Ethernet55
   description L2_NoLa-Leaf-3E_Ethernet25
   no shutdown
   switchport access vlan 4092
   switchport mode access
   switchport
   channel-group 55 mode active
!
interface Management1
   no lldp transmit
   no lldp receive
!
interface Vlan4092
   description Inband Management
   no shutdown
   mtu 1500
   ip address 10.40.92.8/24
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 1500
   no autostate
   ip address 192.168.254.8/31
!
mlag configuration
   domain-id MLAG
   local-interface Vlan4094
   peer-address 192.168.254.9
   peer-link Port-Channel49
   reload-delay mlag 300
   reload-delay non-mlag 330
!
ip route 0.0.0.0/0 10.40.92.1
!
ntp server pool.ntp.org
!
end
