!RANCID-CONTENT-TYPE: arista
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=192.168.0.5:9910 -cvauth=token,/tmp/token -cvvrf=default -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -ingestexclude=/Sysdb/cell/1/agent,/Sysdb/cell/2/agent -taillogs
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname LEAF1B
!
spanning-tree mode mstp
no spanning-tree vlan-id 4094
spanning-tree mst 0 priority 4096
!
aaa authorization exec default local
!
no enable password
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$eucN5ngreuExDgwS$xnD7T8jO..GBDX0DUlp.hn.W7yW94xTjSanqgaQGBzPIhDAsyAl9N4oScHvOMvf07uVBFI4mKMxwdVEUVKgY/.
username cvpadmin privilege 15 role network-admin secret sha512 $6$XOCcW4/weIt.C2WR$AtbIXCExWUYtwFYNONsRXROqasVjijl3j9HZVXgMIV/favxx3D2uxRH45L2kwD0G1x/K8sn6fIjKiiDgzd0Gr1
!
vlan 11
   name VRF10_VLAN11
!
vlan 12
   name VRF10_VLAN12
!
vlan 13
   name VRF10_VLAN13
!
vlan 14
   name VRF10_VLAN14
!
vlan 21
   name VRF11_VLAN21
!
vlan 22
   name VRF11_VLAN22
!
vlan 3401
   name L2_VLAN3401
!
vlan 3402
   name L2_VLAN3402
!
vlan 4094
   name MLAG_PEER
   trunk group MLAG
!
interface Port-Channel5
   description dc1-leaf1-server1_PortChannel dc1-leaf1-server1
   no shutdown
   switchport
   switchport trunk allowed vlan 11-13,21-22
   switchport trunk native vlan 4092
   switchport mode trunk
   mlag 5
   spanning-tree portfast
!
interface Port-Channel49
   description MLAG_PEER_LEAF1A_Po49
   no shutdown
   switchport
   switchport mode trunk
   switchport trunk group MLAG
!
interface Port-Channel51
   description SPINES_Po1
   no shutdown
   switchport
   switchport trunk allowed vlan 11-14,21-22,3401-3402
   switchport mode trunk
   mlag 51
!
interface Ethernet5
   description dc1-leaf1-server1_PCI2
   no shutdown
   channel-group 5 mode active
!
interface Ethernet49
   description MLAG_PEER_LEAF1A_Ethernet49
   no shutdown
   channel-group 49 mode active
!
interface Ethernet50
   description MLAG_PEER_LEAF1A_Ethernet50
   no shutdown
   channel-group 49 mode active
!
interface Ethernet51
   description SPINE1_Ethernet2
   no shutdown
   channel-group 51 mode active
!
interface Ethernet52
   description SPINE2_Ethernet2
   no shutdown
   channel-group 51 mode active
!
interface Management1
   description oob_management
   no shutdown
   ip address 192.168.0.14/24
!
interface Vlan4094
   description MLAG_PEER
   no shutdown
   mtu 1500
   no autostate
   ip address 192.168.254.1/31
!
mlag configuration
   domain-id MLAG
   local-interface Vlan4094
   peer-address 192.168.254.0
   peer-link Port-Channel49
   reload-delay mlag 300
   reload-delay non-mlag 330
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf default
      no shutdown
!
end
