!RANCID-CONTENT-TYPE: arista
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=192.168.0.5:9910 -cvauth=token,/tmp/token -cvvrf=default -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -ingestexclude=/Sysdb/cell/1/agent,/Sysdb/cell/2/agent -taillogs
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname SPINE2
!
spanning-tree mode none
!
aaa authorization exec default local
!
no enable password
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$eucN5ngreuExDgwS$xnD7T8jO..GBDX0DUlp.hn.W7yW94xTjSanqgaQGBzPIhDAsyAl9N4oScHvOMvf07uVBFI4mKMxwdVEUVKgY/.
username cvpadmin privilege 15 role network-admin secret sha512 $6$XOCcW4/weIt.C2WR$AtbIXCExWUYtwFYNONsRXROqasVjijl3j9HZVXgMIV/favxx3D2uxRH45L2kwD0G1x/K8sn6fIjKiiDgzd0Gr1
!
interface Ethernet1
   description P2P_LINK_TO_LEAF1A_Ethernet52
   no shutdown
   mtu 1500
   no switchport
   ip address 172.16.200.2/31
!
interface Ethernet2
   description P2P_LINK_TO_LEAF1B_Ethernet52
   no shutdown
   mtu 1500
   no switchport
   ip address 172.16.200.6/31
!
interface Ethernet3
   description P2P_LINK_TO_LEAF2A_Ethernet52
   no shutdown
   mtu 1500
   no switchport
   ip address 172.16.200.10/31
!
interface Ethernet4
   description P2P_LINK_TO_LEAF2B_Ethernet52
   no shutdown
   mtu 1500
   no switchport
   ip address 172.16.200.14/31
!
interface Loopback0
   description EVPN_Overlay_Peering
   no shutdown
   ip address 172.16.255.2/32
!
interface Management1
   description oob_management
   no shutdown
   ip address 192.168.0.12/24
!
ip routing
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 172.16.255.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65000
   router-id 172.16.255.2
   maximum-paths 4 ecmp 4
   update wait-install
   no bgp default ipv4-unicast
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS next-hop-unchanged
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 12000
   neighbor 172.16.0.3 peer group EVPN-OVERLAY-PEERS
   neighbor 172.16.0.3 remote-as 65001
   neighbor 172.16.0.3 description LEAF1A
   neighbor 172.16.0.4 peer group EVPN-OVERLAY-PEERS
   neighbor 172.16.0.4 remote-as 65001
   neighbor 172.16.0.4 description LEAF1B
   neighbor 172.16.0.5 peer group EVPN-OVERLAY-PEERS
   neighbor 172.16.0.5 remote-as 65002
   neighbor 172.16.0.5 description LEAF2A
   neighbor 172.16.0.6 peer group EVPN-OVERLAY-PEERS
   neighbor 172.16.0.6 remote-as 65002
   neighbor 172.16.0.6 description LEAF2B
   neighbor 172.16.200.3 peer group IPv4-UNDERLAY-PEERS
   neighbor 172.16.200.3 remote-as 65001
   neighbor 172.16.200.3 description LEAF1A_Ethernet52
   neighbor 172.16.200.7 peer group IPv4-UNDERLAY-PEERS
   neighbor 172.16.200.7 remote-as 65001
   neighbor 172.16.200.7 description LEAF1B_Ethernet52
   neighbor 172.16.200.11 peer group IPv4-UNDERLAY-PEERS
   neighbor 172.16.200.11 remote-as 65002
   neighbor 172.16.200.11 description LEAF2A_Ethernet52
   neighbor 172.16.200.15 peer group IPv4-UNDERLAY-PEERS
   neighbor 172.16.200.15 remote-as 65002
   neighbor 172.16.200.15 description LEAF2B_Ethernet52
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf default
      no shutdown
!
end
