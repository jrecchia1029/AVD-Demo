!
no enable password
no aaa root
!
username cvpadmin privilege 15 role network-admin secret sha512 $6$ikGzKyb6w4yEqLly$mJLofKfPrT2Mx6UffrY2dwFXuTCbtf2Okjfu9CgyuduVdN3WIrq9quRZXXFjrRI754ewFQ3uZSlwSEKAe2zbP1
!
agent KernelFib environment KERNELFIB_PROGRAM_ALL_ECMP='true'
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=apiserver.arista.io:443 -cvauth=token-secure,/tmp/cv-onboarding-token -cvvrf=default -disableaaa -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -ingestexclude=/Sysdb/cell/1/agent,/Sysdb/cell/2/agent -taillogs
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname NoLa-Leaf-2A
ip name-server vrf default 1.1.1.1
ip name-server vrf default 8.8.8.8
ip name-server vrf default 169.254.169.254
!
spanning-tree mode mstp
spanning-tree mst 0 priority 4096
!
vlan 4092
   name INBAND_MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf default
      no shutdown
!
aaa authorization exec default local
!
interface Port-Channel971
   description L2_SPINES_Port-Channel3
   no shutdown
   switchport trunk allowed vlan 4092
   switchport mode trunk
   switchport
!
interface Ethernet97/1
   description L2_NoLa-Spine-1_Ethernet3
   no shutdown
   channel-group 971 mode active
!
interface Ethernet98/1
   description L2_NoLa-Spine-2_Ethernet3
   no shutdown
   channel-group 971 mode active
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   ip address 192.168.0.17/24
   no lldp transmit
   no lldp receive
!
interface Vlan4092
   description Inband Management
   no shutdown
   mtu 1500
   ip address 10.40.92.6/24
!
ip route 0.0.0.0/0 10.40.92.1
!
ntp server pool.ntp.org
!
end
