!RANCID-CONTENT-TYPE: arista
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=192.168.0.5:9910 -cvauth=token,/tmp/token -cvvrf=default -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -ingestexclude=/Sysdb/cell/1/agent,/Sysdb/cell/2/agent -taillogs
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname LEAF1A
!
spanning-tree mode mstp
no spanning-tree vlan-id 4093-4094
spanning-tree mst 0 priority 4096
!
aaa authorization exec default local
!
no enable password
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$eucN5ngreuExDgwS$xnD7T8jO..GBDX0DUlp.hn.W7yW94xTjSanqgaQGBzPIhDAsyAl9N4oScHvOMvf07uVBFI4mKMxwdVEUVKgY/.
username cvpadmin privilege 15 role network-admin secret sha512 $6$XOCcW4/weIt.C2WR$AtbIXCExWUYtwFYNONsRXROqasVjijl3j9HZVXgMIV/favxx3D2uxRH45L2kwD0G1x/K8sn6fIjKiiDgzd0Gr1
!
vlan 11
   name VRF10_VLAN11
!
vlan 12
   name VRF10_VLAN12
!
vlan 13
   name VRF10_VLAN13
!
vlan 14
   name VRF10_VLAN14
!
vlan 21
   name VRF11_VLAN21
!
vlan 22
   name VRF11_VLAN22
!
vlan 3009
   name MLAG_iBGP_VRF10
   trunk group LEAF_PEER_L3
!
vlan 3010
   name MLAG_iBGP_VRF11
   trunk group LEAF_PEER_L3
!
vlan 3401
   name L2_VLAN3401
!
vlan 3402
   name L2_VLAN3402
!
vlan 4093
   name LEAF_PEER_L3
   trunk group LEAF_PEER_L3
!
vlan 4094
   name MLAG_PEER
   trunk group MLAG
!
vrf instance VRF10
!
vrf instance VRF11
!
interface Port-Channel5
   description dc1-leaf1-server1_PortChannel dc1-leaf1-server1
   no shutdown
   switchport
   switchport trunk allowed vlan 11-13,21-22
   switchport trunk native vlan 4092
   switchport mode trunk
   mlag 5
   spanning-tree portfast
!
interface Port-Channel49
   description MLAG_PEER_LEAF1B_Po49
   no shutdown
   switchport
   switchport mode trunk
   switchport trunk group LEAF_PEER_L3
   switchport trunk group MLAG
!
interface Port-Channel53
   description LEAF1C_Po51
   no shutdown
   switchport
   switchport trunk allowed vlan 11-14,21-22,3401-3402
   switchport mode trunk
   mlag 53
!
interface Port-Channel54
   description LEAF1D_Po51
   no shutdown
   switchport
   switchport trunk allowed vlan 11-14,21-22,3401-3402
   switchport mode trunk
   mlag 54
!
interface Ethernet5
   description dc1-leaf1-server1_PCI1
   no shutdown
   channel-group 5 mode active
!
interface Ethernet49
   description MLAG_PEER_LEAF1B_Ethernet49
   no shutdown
   channel-group 49 mode active
!
interface Ethernet50
   description MLAG_PEER_LEAF1B_Ethernet50
   no shutdown
   channel-group 49 mode active
!
interface Ethernet51
   description P2P_LINK_TO_SPINE1_Ethernet1
   no shutdown
   mtu 1500
   no switchport
   ip address 172.16.200.1/31
!
interface Ethernet52
   description P2P_LINK_TO_SPINE2_Ethernet1
   no shutdown
   mtu 1500
   no switchport
   ip address 172.16.200.3/31
!
interface Ethernet53
   description LEAF1C_Ethernet51
   no shutdown
   channel-group 53 mode active
!
interface Ethernet54
   description LEAF1D_Ethernet51
   no shutdown
   channel-group 54 mode active
!
interface Loopback0
   description EVPN_Overlay_Peering
   no shutdown
   ip address 172.16.0.3/32
!
interface Loopback1
   description VTEP_VXLAN_Tunnel_Source
   no shutdown
   ip address 172.16.1.3/32
!
interface Loopback10
   description VRF10_VTEP_DIAGNOSTICS
   no shutdown
   vrf VRF10
   ip address 10.255.10.3/32
!
interface Loopback11
   description VRF11_VTEP_DIAGNOSTICS
   no shutdown
   vrf VRF11
   ip address 10.255.11.3/32
!
interface Management1
   description oob_management
   no shutdown
   ip address 192.168.0.13/24
!
interface Vlan11
   description VRF10_VLAN11
   no shutdown
   vrf VRF10
   ip address virtual 10.10.11.1/24
!
interface Vlan12
   description VRF10_VLAN12
   no shutdown
   vrf VRF10
   ip address virtual 10.10.12.1/24
!
interface Vlan13
   description VRF10_VLAN13
   no shutdown
   vrf VRF10
   ip address virtual 10.10.13.1/24
!
interface Vlan14
   description VRF10_VLAN14
   no shutdown
   vrf VRF10
   ip address virtual 10.10.14.1/24
!
interface Vlan21
   description VRF11_VLAN21
   no shutdown
   vrf VRF11
   ip address virtual 10.10.21.1/24
!
interface Vlan22
   description VRF11_VLAN22
   no shutdown
   vrf VRF11
   ip address virtual 10.10.22.1/24
!
interface Vlan3009
   description MLAG_PEER_L3_iBGP: vrf VRF10
   no shutdown
   mtu 1500
   vrf VRF10
   ip address 192.168.254.128/31
!
interface Vlan3010
   description MLAG_PEER_L3_iBGP: vrf VRF11
   no shutdown
   mtu 1500
   vrf VRF11
   ip address 192.168.254.128/31
!
interface Vlan4093
   description MLAG_PEER_L3_PEERING
   no shutdown
   mtu 1500
   ip address 192.168.254.128/31
!
interface Vlan4094
   description MLAG_PEER
   no shutdown
   mtu 1500
   no autostate
   ip address 192.168.254.0/31
!
interface Vxlan1
   description LEAF1A_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
   vxlan vlan 11 vni 10011
   vxlan vlan 12 vni 10012
   vxlan vlan 13 vni 10013
   vxlan vlan 14 vni 10014
   vxlan vlan 21 vni 10021
   vxlan vlan 22 vni 10022
   vxlan vlan 3401 vni 13401
   vxlan vlan 3402 vni 13402
   vxlan vrf VRF10 vni 10
   vxlan vrf VRF11 vni 11
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip address virtual source-nat vrf VRF10 address 10.255.10.3
ip address virtual source-nat vrf VRF11 address 10.255.11.3
!
ip routing
ip routing vrf VRF10
ip routing vrf VRF11
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 172.16.0.0/24 eq 32
   seq 20 permit 172.16.1.0/24 eq 32
!
mlag configuration
   domain-id MLAG
   local-interface Vlan4094
   peer-address 192.168.254.1
   peer-link Port-Channel49
   reload-delay mlag 300
   reload-delay non-mlag 330
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65001
   router-id 172.16.0.3
   maximum-paths 4 ecmp 4
   update wait-install
   no bgp default ipv4-unicast
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 12000
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65001
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description LEAF1B
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 12000
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor 172.16.200.0 peer group IPv4-UNDERLAY-PEERS
   neighbor 172.16.200.0 remote-as 65000
   neighbor 172.16.200.0 description SPINE1_Ethernet1
   neighbor 172.16.200.2 peer group IPv4-UNDERLAY-PEERS
   neighbor 172.16.200.2 remote-as 65000
   neighbor 172.16.200.2 description SPINE2_Ethernet1
   neighbor 172.16.255.1 peer group EVPN-OVERLAY-PEERS
   neighbor 172.16.255.1 remote-as 65000
   neighbor 172.16.255.1 description SPINE1
   neighbor 172.16.255.2 peer group EVPN-OVERLAY-PEERS
   neighbor 172.16.255.2 remote-as 65000
   neighbor 172.16.255.2 description SPINE2
   neighbor 192.168.254.129 peer group MLAG-IPv4-UNDERLAY-PEER
   neighbor 192.168.254.129 description LEAF1B
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 11
      rd 172.16.0.3:10011
      route-target both 10011:10011
      redistribute learned
   !
   vlan 12
      rd 172.16.0.3:10012
      route-target both 10012:10012
      redistribute learned
   !
   vlan 13
      rd 172.16.0.3:10013
      route-target both 10013:10013
      redistribute learned
   !
   vlan 14
      rd 172.16.0.3:10014
      route-target both 10014:10014
      redistribute learned
   !
   vlan 21
      rd 172.16.0.3:10021
      route-target both 10021:10021
      redistribute learned
   !
   vlan 22
      rd 172.16.0.3:10022
      route-target both 10022:10022
      redistribute learned
   !
   vlan 3401
      rd 172.16.0.3:13401
      route-target both 13401:13401
      redistribute learned
   !
   vlan 3402
      rd 172.16.0.3:13402
      route-target both 13402:13402
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
   !
   vrf VRF10
      rd 172.16.0.3:10
      route-target import evpn 10:10
      route-target export evpn 10:10
      router-id 172.16.0.3
      update wait-install
      neighbor 192.168.254.129 peer group MLAG-IPv4-UNDERLAY-PEER
      redistribute connected
   !
   vrf VRF11
      rd 172.16.0.3:11
      route-target import evpn 11:11
      route-target export evpn 11:11
      router-id 172.16.0.3
      update wait-install
      neighbor 192.168.254.129 peer group MLAG-IPv4-UNDERLAY-PEER
      redistribute connected
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf default
      no shutdown
!
end
