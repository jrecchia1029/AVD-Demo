mlag_configuration:
  domain_id: MLAG
  local_interface: Vlan4094
  peer_address: 192.168.254.1
  peer_link: Port-Channel49
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
route_maps:
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    set:
    - origin incomplete
    description: Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
loopback_interfaces:
- name: Loopback0
  description: EVPN_Overlay_Peering
  shutdown: false
  ip_address: 172.16.0.3/32
- name: Loopback1
  description: VTEP_VXLAN_Tunnel_Source
  shutdown: false
  ip_address: 172.16.1.3/32
- name: Loopback10
  description: VRF10_VTEP_DIAGNOSTICS
  shutdown: false
  vrf: VRF10
  ip_address: 10.255.10.3/32
- name: Loopback11
  description: VRF11_VTEP_DIAGNOSTICS
  shutdown: false
  vrf: VRF11
  ip_address: 10.255.11.3/32
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 172.16.0.0/24 eq 32
  - sequence: 20
    action: permit 172.16.1.0/24 eq 32
router_bfd:
