hostname: LEAF1A
is_deployed: true
serial_number: SN-LEAF1A
router_bgp:
  as: '65001'
  router_id: 172.16.0.3
  bgp:
    default:
      ipv4_unicast: false
  maximum_paths:
    paths: 4
    ecmp: 4
  updates:
    wait_install: true
  peer_groups:
  - name: MLAG-IPv4-UNDERLAY-PEER
    type: ipv4
    remote_as: '65001'
    next_hop_self: true
    description: LEAF1B
    maximum_routes: 12000
    send_community: all
    route_map_in: RM-MLAG-PEER-IN
  - name: IPv4-UNDERLAY-PEERS
    type: ipv4
    maximum_routes: 12000
    send_community: all
  - name: EVPN-OVERLAY-PEERS
    type: evpn
    update_source: Loopback0
    bfd: true
    send_community: all
    maximum_routes: 0
    ebgp_multihop: 3
  address_family_ipv4:
    peer_groups:
    - name: MLAG-IPv4-UNDERLAY-PEER
      activate: true
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
  neighbors:
  - ip_address: 192.168.254.129
    peer_group: MLAG-IPv4-UNDERLAY-PEER
    peer: LEAF1B
    description: LEAF1B
  - ip_address: 172.16.200.0
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65000'
    peer: SPINE1
    description: SPINE1_Ethernet1
  - ip_address: 172.16.200.2
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65000'
    peer: SPINE2
    description: SPINE2_Ethernet1
  - ip_address: 172.16.255.1
    peer_group: EVPN-OVERLAY-PEERS
    peer: SPINE1
    description: SPINE1
    remote_as: '65000'
  - ip_address: 172.16.255.2
    peer_group: EVPN-OVERLAY-PEERS
    peer: SPINE2
    description: SPINE2
    remote_as: '65000'
  redistribute_routes:
  - source_protocol: connected
    route_map: RM-CONN-2-BGP
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  vrfs:
  - name: VRF10
    router_id: 172.16.0.3
    rd: 172.16.0.3:10
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '10:10'
      export:
      - address_family: evpn
        route_targets:
        - '10:10'
    redistribute_routes:
    - source_protocol: connected
    neighbors:
    - ip_address: 192.168.254.129
      peer_group: MLAG-IPv4-UNDERLAY-PEER
    updates:
      wait_install: true
  - name: VRF11
    router_id: 172.16.0.3
    rd: 172.16.0.3:11
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '11:11'
      export:
      - address_family: evpn
        route_targets:
        - '11:11'
    redistribute_routes:
    - source_protocol: connected
    neighbors:
    - ip_address: 192.168.254.129
      peer_group: MLAG-IPv4-UNDERLAY-PEER
    updates:
      wait_install: true
  vlans:
  - id: 11
    tenant: TENANT1
    rd: 172.16.0.3:10011
    route_targets:
      both:
      - 10011:10011
    redistribute_routes:
    - learned
  - id: 12
    tenant: TENANT1
    rd: 172.16.0.3:10012
    route_targets:
      both:
      - 10012:10012
    redistribute_routes:
    - learned
  - id: 21
    tenant: TENANT1
    rd: 172.16.0.3:10021
    route_targets:
      both:
      - 10021:10021
    redistribute_routes:
    - learned
  - id: 22
    tenant: TENANT1
    rd: 172.16.0.3:10022
    route_targets:
      both:
      - 10022:10022
    redistribute_routes:
    - learned
  - id: 3401
    tenant: TENANT1
    rd: 172.16.0.3:13401
    route_targets:
      both:
      - 13401:13401
    redistribute_routes:
    - learned
  - id: 3402
    tenant: TENANT1
    rd: 172.16.0.3:13402
    route_targets:
      both:
      - 13402:13402
    redistribute_routes:
    - learned
service_routing_protocols_model: multi-agent
ip_routing: true
daemon_terminattr:
