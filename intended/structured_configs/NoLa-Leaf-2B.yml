  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: MLAG-IPv4-UNDERLAY-PEER
      activate: true
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
  vrfs:
  - name: VRF10
    rd: 172.16.0.6:10
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '10:10'
      export:
      - address_family: evpn
        route_targets:
        - '10:10'
    router_id: 172.16.0.6
    updates:
      wait_install: true
    neighbors:
    - ip_address: 192.168.254.132
      peer_group: MLAG-IPv4-UNDERLAY-PEER
      description: NoLa-Leaf-2A_Vlan3009
    redistribute:
