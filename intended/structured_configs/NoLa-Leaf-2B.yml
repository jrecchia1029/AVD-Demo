prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 172.16.0.0/24 eq 32
  - sequence: 20
    action: permit 172.16.1.0/24 eq 32
- name: PL-MLAG-PEER-VRFS
  sequence_numbers:
  - sequence: 10
    action: permit 192.168.254.132/31
route_maps:
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    description: Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
    set:
    - origin incomplete
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
- name: RM-CONN-2-BGP-VRFS
  sequence_numbers:
  - sequence: 10
    type: deny
    match:
    - ip address prefix-list PL-MLAG-PEER-VRFS
  - sequence: 20
    type: permit
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65002'
  router_id: 172.16.0.6
  maximum_paths:
    paths: 4
    ecmp: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MLAG-IPv4-UNDERLAY-PEER
    type: ipv4
    remote_as: '65002'
    description: NoLa-Leaf-2A
    next_hop_self: true
    send_community: all
    maximum_routes: 12000
    route_map_in: RM-MLAG-PEER-IN
  - name: IPv4-UNDERLAY-PEERS
    type: ipv4
    send_community: all
    maximum_routes: 12000
  - name: EVPN-OVERLAY-PEERS
    type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 192.168.254.132
    peer_group: MLAG-IPv4-UNDERLAY-PEER
    peer: NoLa-Leaf-2A
    description: NoLa-Leaf-2A_Vlan4093
  - ip_address: 172.16.200.12
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65000'
    peer: NoLa-Spine-1
    description: NoLa-Spine-1_Ethernet4
  - ip_address: 172.16.200.14
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65000'
    peer: NoLa-Spine-2
    description: NoLa-Spine-2_Ethernet4
  - ip_address: 172.16.255.1
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65000'
    peer: NoLa-Spine-1
    description: NoLa-Spine-1_Loopback0
  - ip_address: 172.16.255.2
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65000'
    peer: NoLa-Spine-2
    description: NoLa-Spine-2_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 11
    tenant: TENANT1
    rd: 172.16.0.6:10011
    route_targets:
      both:
      - 10011:10011
    redistribute_routes:
    - learned
  - id: 12
    tenant: TENANT1
    rd: 172.16.0.6:10012
    route_targets:
      both:
      - 10012:10012
    redistribute_routes:
    - learned
  - id: 21
    tenant: TENANT1
    rd: 172.16.0.6:10021
    route_targets:
      both:
      - 10021:10021
    redistribute_routes:
    - learned
  - id: 22
    tenant: TENANT1
    rd: 172.16.0.6:10022
    route_targets:
      both:
      - 10022:10022
    redistribute_routes:
    - learned
  - id: 3401
    tenant: TENANT1
    rd: 172.16.0.6:13401
    route_targets:
      both:
      - 13401:13401
    redistribute_routes:
    - learned
  - id: 3402
    tenant: TENANT1
    rd: 172.16.0.6:13402
    route_targets:
      both:
      - 13402:13402
    redistribute_routes:
