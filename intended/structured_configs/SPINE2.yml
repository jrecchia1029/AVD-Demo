hostname: SPINE2
is_deployed: true
serial_number: SN-SPINE2
router_bgp:
  as: '65000'
  router_id: 172.16.255.2
  bgp:
    default:
      ipv4_unicast: false
  maximum_paths:
    paths: 4
    ecmp: 4
  updates:
    wait_install: true
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    type: ipv4
    maximum_routes: 12000
    send_community: all
  - name: EVPN-OVERLAY-PEERS
    type: evpn
    update_source: Loopback0
    bfd: true
    send_community: all
    maximum_routes: 0
    ebgp_multihop: 3
    next_hop_unchanged: true
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
  redistribute_routes:
  - source_protocol: connected
    route_map: RM-CONN-2-BGP
  neighbors:
  - ip_address: 172.16.200.3
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65001'
    peer: LEAF1A
    description: LEAF1A_Ethernet52
  - ip_address: 172.16.200.7
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65001'
    peer: LEAF1B
    description: LEAF1B_Ethernet52
  - ip_address: 172.16.200.11
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65002'
    peer: LEAF2A
    description: LEAF2A_Ethernet52
  - ip_address: 172.16.200.15
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65002'
    peer: LEAF2B
    description: LEAF2B_Ethernet52
  - ip_address: 172.16.0.3
    peer_group: EVPN-OVERLAY-PEERS
    peer: LEAF1A
    description: LEAF1A
    remote_as: '65001'
  - ip_address: 172.16.0.4
    peer_group: EVPN-OVERLAY-PEERS
    peer: LEAF1B
    description: LEAF1B
    remote_as: '65001'
  - ip_address: 172.16.0.5
    peer_group: EVPN-OVERLAY-PEERS
    peer: LEAF2A
    description: LEAF2A
    remote_as: '65002'
  - ip_address: 172.16.0.6
    peer_group: EVPN-OVERLAY-PEERS
    peer: LEAF2B
    description: LEAF2B
    remote_as: '65002'
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
service_routing_protocols_model: multi-agent
ip_routing: true
daemon_terminattr:
  cvaddrs:
  - 192.168.0.5:9910
  cvauth:
    method: token
    token_file: /tmp/token
  cvvrf: default
  smashexcludes: ale,flexCounter,hardware,kni,pulse,strata
  ingestexclude: /Sysdb/cell/1/agent,/Sysdb/cell/2/agent
  disable_aaa: false
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
spanning_tree:
  mode: none
local_users:
- name: admin
  privilege: 15
  role: network-admin
  sha512_password: $6$eucN5ngreuExDgwS$xnD7T8jO..GBDX0DUlp.hn.W7yW94xTjSanqgaQGBzPIhDAsyAl9N4oScHvOMvf07uVBFI4mKMxwdVEUVKgY/.
- name: cvpadmin
  privilege: 15
  role: network-admin
  sha512_password: $6$XOCcW4/weIt.C2WR$AtbIXCExWUYtwFYNONsRXROqasVjijl3j9HZVXgMIV/favxx3D2uxRH45L2kwD0G1x/K8sn6fIjKiiDgzd0Gr1
vrfs:
- name: default
  ip_routing: true
management_interfaces:
- name: Management1
  description: oob_management
  shutdown: false
  vrf: default
  ip_address: 192.168.0.12/24
  gateway: null
  type: oob
management_api_http:
  enable_vrfs:
  - name: default
  enable_https: true
ethernet_interfaces:
- name: Ethernet1
  peer: LEAF1A
  peer_interface: Ethernet52
  peer_type: l3leaf
  description: P2P_LINK_TO_LEAF1A_Ethernet52
  shutdown: false
  mtu: 1500
  type: routed
  ip_address: 172.16.200.2/31
- name: Ethernet2
  peer: LEAF1B
  peer_interface: Ethernet52
  peer_type: l3leaf
  description: P2P_LINK_TO_LEAF1B_Ethernet52
  shutdown: false
  mtu: 1500
  type: routed
  ip_address: 172.16.200.6/31
- name: Ethernet3
  peer: LEAF2A
  peer_interface: Ethernet52
  peer_type: l3leaf
  description: P2P_LINK_TO_LEAF2A_Ethernet52
  shutdown: false
  mtu: 1500
  type: routed
  ip_address: 172.16.200.10/31
- name: Ethernet4
  peer: LEAF2B
  peer_interface: Ethernet52
  peer_type: l3leaf
  description: P2P_LINK_TO_LEAF2B_Ethernet52
  shutdown: false
  mtu: 1500
  type: routed
  ip_address: 172.16.200.14/31
loopback_interfaces:
- name: Loopback0
  description: EVPN_Overlay_Peering
  shutdown: false
  ip_address: 172.16.255.2/32
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 172.16.255.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
metadata:
  platform: vEOS-Lab
campus_tag: SNG
campus_pod_tag: Pod1
